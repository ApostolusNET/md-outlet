version: 1
meta:
  name: simple-preview
  description: Casual MD viewing — no forced chapter breaks. Good for README / downloaded docs.
page:
  format: A4
  orientation: portrait
  margin:
    top: 20mm
    right: 18mm
    bottom: 20mm
    left: 18mm
  printBackground: true
theme: default
breaks:
  beforeHeadings: []
  skipFirst: true
  avoidInside: [pre, table, blockquote]
  avoidAfter: [h2, h3, h4]
markdown:
  gfm: true
  highlight: true
  highlightStyle: github
  allowHtml: true
bodyClass: [simple-preview]
