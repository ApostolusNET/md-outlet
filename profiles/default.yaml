version: 1
meta:
  name: default
  description: General-purpose document profile. A4 with sensible margins.
page:
  format: A4
  orientation: portrait
  margin:
    top: 20mm
    right: 18mm
    bottom: 20mm
    left: 18mm
  printBackground: true
theme: default
breaks:
  beforeHeadings: []
  skipFirst: true
  avoidInside: [pre, table, blockquote]
  avoidAfter: [h2, h3, h4]
markdown:
  gfm: true
  highlight: true
  highlightStyle: github
  allowHtml: true
bodyClass: []
